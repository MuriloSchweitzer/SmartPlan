services:
  postgres:
    image: postgres:17-alpine
    container_name: smartplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartplan
      POSTGRES_USER: smartplan
      POSTGRES_PASSWORD: smartplan_local
    ports:
      - "5432:5432"
    volumes:
      - smartplan_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartplan -d smartplan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartplan_postgres_data:
