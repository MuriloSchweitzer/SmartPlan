services:
  postgres:
    image: postgres:17-alpine
    container_name: smartplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartplan
      POSTGRES_USER: smartplan
      POSTGRES_PASSWORD: smartplan_local
    ports:
      - "5432:5432"
    volumes:
      - smartplan_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartplan -d smartplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartplan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartplan:smartplan_local@postgres:5432/smartplan
      JWT_SECRET: smartplan-local-development-secret-change-me
      FRONTEND_URL: http://localhost:5173
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - "8080:8080"

volumes:
  smartplan_postgres_data:
