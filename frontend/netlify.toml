[build]
  command = "npm run build -w frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["@netlify/database", "express", "pg", "serverless-http"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
